<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenti Limnología</title>
<link rel="icon" type="image/png" href="/icono.png">
<style>[hidden]{display:none!important}</style>
<style>
@font-face{font-family:"Public Sans";src:url(/fuentes/PublicSans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Public Sans";src:url(/fuentes/PublicSans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Public Sans";src:url(/fuentes/PublicSans-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Public Sans";src:url(/fuentes/PublicSans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(/fuentes/SourceSerif4-Roman.ttf) format("truetype");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(/fuentes/SourceSerif4-Italic.ttf) format("truetype");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fuentes/IBMPlexMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  color-scheme: light;
  --page:#f2f4ef; --surface:#ffffff; --surface-2:#eaeee5; --ink:#18200f; --ink-2:#465040; --muted:#768070;
  --line:#dde2d6; --line-strong:#c3cab9; --accent:#3d6b1c; --accent-ink:#ffffff; --accent-soft:#e2ecd5;
  --shadow:0 1px 2px rgba(24,32,15,.06),0 8px 24px rgba(24,32,15,.08);
  --serif:"Source Serif 4", Georgia, serif; --sans:"Public Sans", system-ui, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark; --page:#0e120c; --surface:#161c13; --surface-2:#1f271b; --ink:#e8eee1; --ink-2:#b8c2ae; --muted:#86917b;
    --line:#29321f; --line-strong:#3a4631; --accent:#8fc35a; --accent-ink:#0f150a; --accent-soft:#22301a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding:40px 20px 56px}
header{display:flex;align-items:center;gap:16px;margin-bottom:8px}
header img{height:56px;width:auto}
h1{font:600 34px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.lead{color:var(--ink-2);font-size:17px;margin:6px 0 30px;max-width:640px}
h2{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
a.card b{font:600 20px/1.2 var(--serif)}
a.card .d{color:var(--ink-2);font-size:14px;flex:1}
a.card .s{font:400 12px/1.3 var(--mono);color:var(--muted);margin-top:6px}
a.card .s i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-strong);margin-right:6px}
a.card .s.ok i{background:var(--accent)}
a.global{background:var(--accent-soft);border-color:var(--accent)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
button.link{background:none;border:0;color:var(--accent);font:600 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
code{font:400 12px var(--mono);color:var(--ink-2)}
.lang{margin-left:auto;display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{font:600 12px var(--sans);letter-spacing:.04em;padding:5px 10px;border:0;background:var(--surface);color:var(--ink-2);cursor:pointer}
.lang button+button{border-left:1px solid var(--line-strong)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="__LOGO__" alt=""><h1 data-es="Kenti Limnología">Kenti Limnología</h1><div class="lang" role="group" aria-label="Idioma · Language"><button type="button" data-lang="es" aria-pressed="false" title="Español">ES</button><button type="button" data-lang="en" aria-pressed="false" title="English">EN</button><button type="button" data-lang="pt" aria-pressed="false" title="Português">PT</button></div></header>
  <p class="lead">Datos ecológicos de ambientes acuáticos en un solo lugar. Elegí con qué especialidad querés trabajar; cada una guarda sus datos por separado.</p>

  <h2>Especialidades</h2>
  <div class="grid">
__CARDS__
  </div>

  <div class="foot">
    <span>Datos en <code id="carpeta">Documentos\Kenti Limnología</code></span>
    <button class="link" id="abrir" hidden>Abrir carpeta de datos</button>
    <span id="ver" style="margin-left:auto"></span>
  </div>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  // Idioma: el elegido antes (el mismo que usan los módulos) o el del sistema.
  let L = window.KENTI_LANG0 || null; try { if (!L) L = localStorage.getItem("kenti-lang"); } catch(e){}
  if (L !== "es" && L !== "en" && L !== "pt") { const nl = navigator.language || "es"; L = /^es\b/i.test(nl) ? "es" : /^pt\b/i.test(nl) ? "pt" : "en"; }
  document.documentElement.lang = L;
  const T = __I18N__;
  const tr = s => (L !== "es" && T[L] && T[L][s]) || s;
  const LOC = {es: "es-AR", en: "en-US", pt: "pt-BR"}[L];
  document.title = tr(document.title);
  document.querySelectorAll("h1, h2, .lead, .foot > span:first-child, #abrir, a.card b, a.card .d").forEach(el => {
    el.childNodes.forEach(n => { if (n.nodeType === 3 && n.nodeValue.trim()) n.nodeValue = n.nodeValue.replace(n.nodeValue.trim(), tr(n.nodeValue.trim())); });
  });
  document.querySelectorAll(".lang button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === L));
    b.onclick = async () => { try { localStorage.setItem("kenti-lang", b.dataset.lang); } catch(e){} try { await fetch("/api/idioma", {method:"PUT", headers:{"Content-Type":"application/json", "X-Kenti":"1"}, body: JSON.stringify({idioma: b.dataset.lang})}); } catch(e){} location.reload(); };
  });
  function fecha(iso){ try { return new Date(iso).toLocaleDateString(LOC, {day:"numeric", month:"short", year:"numeric"}); } catch(e){ return ""; } }
  fetch("/api/estado", {headers:{"X-Kenti":"1"}, cache:"no-store"}).then(r => r.json()).then(j => {
    $("#carpeta").textContent = j.carpeta; $("#ver").textContent = tr($("h1").dataset.es || "Kenti Limnología") + " " + j.version; $("#abrir").hidden = false;
    Object.keys(j.grupos).forEach(id => {
      const e = j.grupos[id], el = document.querySelector('[data-s="'+id+'"]'); if (!el) return;
      el.className = "s" + (e.datos ? " ok" : "");
      el.innerHTML = "<i></i>" + (e.datos ? tr("Datos guardados") + " · " + fecha(e.modificado) : tr("Sin datos todavía"));
    });
  }).catch(() => { document.querySelectorAll("[data-s]").forEach(el => el.textContent = ""); });
  $("#abrir").onclick = () => fetch("/api/abrir-carpeta", {method:"POST", headers:{"X-Kenti":"1"}});
  setInterval(() => fetch("/api/ping", {headers:{"X-Kenti":"1"}}).catch(()=>{}), 30000);
  fetch("/api/ping", {headers:{"X-Kenti":"1"}}).catch(()=>{});
})();
</script>
</body>
</html>
